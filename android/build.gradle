group 'com.example.bluetooth_print'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0' // ✅ Updated to match Flutter 3.22/3.27 support
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.bluetooth_print' // ✅ required for AGP 7+
    compileSdkVersion 34                    // ✅ match your app (e.g., Flutter 3.27.0)

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34                 // ✅ good to set explicitly
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17   // ✅ match with Flutter Java 17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation files('libs/gprintersdkv2.jar')
    implementation "androidx.core:core:1.6.0"
}
